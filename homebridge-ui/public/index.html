<!-- Custom settings UI. The schema-driven form is NOT shown: every field is
     rendered here so the page follows the task flow (account, devices,
     housekeeping) and the support footer can sit at the very bottom. When
     adding a new config field, add it to this page AND to config.schema.json.
     All writes are read-modify-write against getPluginConfig() so fields the
     page doesn't own (e.g. Homebridge's _bridge child-bridge block) are kept.

     Every visible string comes from I18N below (en / zh-TW / ja) and follows the
     Homebridge UI language: static markup names its key in data-i18n, scripts
     call t(). A new string needs all three languages. -->

<!-- Config UI X mirrors its theme into this iframe only as body classes (dark
     themes add `dark-mode`), while the injected Bootstrap sheet keeps :root in
     light theme, so .text-muted would be near-black on the dark card. Colours
     lean on currentColor/opacity, with body.dark-mode overrides where not. -->
<style>
  body.dark-mode .text-muted { color: inherit !important; opacity: 0.7; }
  .jhp-opts { border: 1px solid #dee2e6; border-radius: 8px; }
  .jhp-opt { display: flex; gap: 12px; padding: 10px 12px; align-items: flex-start; }
  .jhp-opt + .jhp-opt { border-top: 1px solid #dee2e6; }
  body.dark-mode .jhp-opts { border-color: #3e4144; }
  body.dark-mode .jhp-opt + .jhp-opt { border-top-color: #3e4144; }
  .jhp-opt-main { flex: 1 1 auto; min-width: 0; }
  .jhp-opt-title { font-weight: 600; font-size: 13px; }
  .jhp-opt-desc { font-size: 12px; opacity: 0.7; line-height: 1.5; margin-top: 1px; }
  .jhp-sw { position: relative; display: inline-block; flex-shrink: 0; margin: 2px 0 0; }
  .jhp-sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .jhp-sw .jhp-track { display: block; width: 36px; height: 20px; border-radius: 10px; background: #adb5bd; position: relative; transition: background 0.15s; }
  .jhp-sw .jhp-track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); transition: transform 0.15s; }
  .jhp-sw input:checked + .jhp-track { background: #0d6efd; }
  .jhp-sw input:checked + .jhp-track::after { transform: translateX(16px); }
  .jhp-sw input:focus-visible + .jhp-track { outline: 2px solid #0d6efd; outline-offset: 2px; }
  /* One row per device: name and type on the left, its HomeKit switch on the
     right, and below that the tags for what it shows in the Home app. */
  .jhp-dev { padding: 10px 12px; }
  .jhp-dev + .jhp-dev { border-top: 1px solid #dee2e6; }
  body.dark-mode .jhp-dev + .jhp-dev { border-top-color: #3e4144; }
  .jhp-dev-all { background: rgba(13, 110, 253, 0.04); border-radius: 7px 7px 0 0; }
  body.dark-mode .jhp-dev-all { background: rgba(110, 168, 254, 0.06); }
  .jhp-dev-head { display: flex; gap: 12px; align-items: flex-start; }
  .jhp-dev-main { flex: 1 1 auto; min-width: 0; }
  .jhp-dev-name { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
  .jhp-dev-meta { font-size: 12px; opacity: 0.7; overflow-wrap: anywhere; }
  .jhp-dev-skip { font-size: 12px; opacity: 0.7; margin-top: 6px; }
  .jhp-dev.is-off .jhp-dev-main { opacity: 0.55; }
  /* Tags: shown is tinted with a solid outline; hidden is a dashed, faded
     outline, the empty slot it leaves in the Home app. */
  .jhp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .jhp-chip { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; margin: 0; padding: 2px 10px 2px 8px; border: 1px solid rgba(13, 110, 253, 0.35); border-radius: 14px; background: rgba(13, 110, 253, 0.08); color: inherit; font-size: 12px; line-height: 1.2; cursor: pointer; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
  .jhp-chip svg { width: 14px; height: 14px; flex-shrink: 0; fill: none; stroke: #0d6efd; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .jhp-chip:hover { border-color: rgba(13, 110, 253, 0.6); }
  .jhp-chip:focus-visible { outline: 2px solid #0d6efd; outline-offset: 2px; }
  .jhp-chip[aria-pressed="false"] { border-style: dashed; border-color: #adb5bd; background: transparent; color: #6c757d; }
  .jhp-chip[aria-pressed="false"] svg { stroke: currentColor; }
  .jhp-chip[aria-pressed="mixed"] { border-color: #adb5bd; background: transparent; }
  .jhp-chip-count { font-variant-numeric: tabular-nums; opacity: 0.75; }
  body.dark-mode .jhp-chip { border-color: rgba(110, 168, 254, 0.4); background: rgba(110, 168, 254, 0.12); }
  body.dark-mode .jhp-chip svg { stroke: #6ea8fe; }
  body.dark-mode .jhp-chip[aria-pressed="false"] { border-color: #6c757d; background: transparent; color: #adb5bd; }
  body.dark-mode .jhp-chip[aria-pressed="false"] svg { stroke: currentColor; }
  body.dark-mode .jhp-chip[aria-pressed="mixed"] { border-color: #6c757d; background: transparent; }
  @media (prefers-reduced-motion: reduce) {
    .jhp-chip, .jhp-sw .jhp-track, .jhp-sw .jhp-track::after { transition: none; }
  }
  .jhp-fields { display: flex; flex-wrap: wrap; gap: 10px 16px; }
  .jhp-fields > div { flex: 1 1 220px; min-width: 0; }
  .jhp-pw { display: flex; gap: 6px; }
  .jhp-pw .form-control { flex: 1 1 auto; min-width: 0; }
  .jhp-pw button { flex-shrink: 0; white-space: nowrap; }
  .jhp-adv-toggle { background: none; border: 0; padding: 0; color: inherit; width: 100%; text-align: left; }
  .jhp-adv-toggle:focus-visible { outline: 2px solid #0d6efd; outline-offset: 2px; }
  .jhp-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85em; }
  .jhp-support { margin: 20px 0 8px; padding-top: 14px; border-top: 1px solid #dee2e6; font-size: 12.5px; }
  body.dark-mode .jhp-support { border-top-color: #3e4144; }
  .jhp-support-text { opacity: 0.7; margin: 0 0 8px; line-height: 1.5; }
  .jhp-support-links { display: flex; flex-wrap: wrap; gap: 8px; }
  .jhp-tip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 3px 12px; border: 1px solid #dee2e6; border-radius: 8px; color: inherit; font-size: 12.5px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .jhp-tip:hover, .jhp-tip:focus { color: inherit; text-decoration: none; border-color: #adb5bd; }
  .jhp-tip:focus-visible { outline: 2px solid #0d6efd; outline-offset: 2px; }
  body.dark-mode .jhp-tip { border-color: #3e4144; }
  body.dark-mode .jhp-tip:hover, body.dark-mode .jhp-tip:focus { border-color: #6c757d; }
  .jhp-tip img { width: 20px; height: 20px; margin-left: -5px; border-radius: 5px; }
  .jhp-support-note { opacity: 0.6; font-size: 11.5px; margin: 8px 0 0; }
</style>

<!-- 1. Account: the device list below needs it, so it comes first. -->
<div class="card mb-3">
  <div class="card-body">
    <h5 class="card-title" data-i18n="accountTitle"></h5>
    <p class="card-text text-muted small mb-2" data-i18n="accountIntro"></p>
    <div class="jhp-fields">
      <div>
        <label for="jhpEmail" class="small mb-1" data-i18n="email"></label>

      <div>
        <label for="jhpPassword" class="small mb-1" data-i18n="password"></label>

        </div>
      </div>

  </div>
</div>

<!-- 2. Devices: whether each unit joins HomeKit (ignoredDevices) and what it
     shows there (devices[].show*, falling back to the top-level show*). -->
<div class="card mb-3">
  <div class="card-body">
    <h5 class="card-title" data-i18n="devicesTitle"></h5>
    <p class="card-text text-muted small mb-2" data-i18n="devicesIntro"></p>

    <div id="deviceList" class="jhp-opts mb-2" hidden></div>
    <button type="button" class="btn btn-primary btn-sm m-0" id="btnRefresh" data-i18n="refresh"></button>
    <p class="card-text text-muted small mt-2 mb-0" data-i18n="devicesNote"></p>
  </div>
</div>

<!-- 3. Advanced: housekeeping nobody touches day-to-day. -->
<div class="card mb-3">
  <div class="card-body py-2">
    <button type="button" id="jhpAdvToggle" class="jhp-adv-toggle d-flex align-items-center" aria-expanded="false" aria-controls="jhpAdvBody">

      <strong data-i18n="advanced"></strong>

      <div class="form-group mt-2 mb-2">
        <label for="jhpName" class="small mb-1" data-i18n="pluginName"></label>
        <input type="text" id="jhpName" class="form-control form-control-sm" placeholder="JciHitachi Platform">

      <div class="jhp-opts mb-2">
        <div class="jhp-opt">

            <div class="jhp-opt-title" id="jhpAutoCleanTitle" data-i18n="autoCleanTitle"></div>

        <div class="jhp-opt">
          <div class="jhp-opt-main">
            <div class="jhp-opt-title" id="jhpDebugTitle" data-i18n="debugTitle"></div>

            <span class="jhp-track"></span>
          </label>
        </div>
      </div>
    </div>
  </div>
</div>

  // Chinese variants share the Traditional Chinese text; anything else without
  // a translation falls back to English.
  function pickLang(code) {
    const c = String(code || '').toLowerCase();
    return c.startsWith('zh') ? 'zh-TW' : c.startsWith('ja') ? 'ja' : 'en';
  }

  // The page stays hidden until this resolves, so don't wait on a Config UI X
  // that never answers; the browser language is the fallback.
  let lang;
  try {
    lang = pickLang((await Promise.race([
      homebridge.i18nCurrentLang(),
      new Promise((resolve) => setTimeout(resolve, 1000)),
    ])) || navigator.language);
  } catch (e) {
    lang = pickLang(navigator.language);
  }

  function t(key, vars) {
    let text = I18N[lang][key] || I18N.en[key] || key;
    for (const name of Object.keys(vars || {})) {
      text = text.replaceAll(`{${name}}`, String(vars[name]));
    }
    return text;
  }

  document.documentElement.lang = lang;
  for (const node of document.querySelectorAll('[data-i18n]')) {
    node.textContent = t(node.dataset.i18n);
  }
  document.getElementById('jhpPage').hidden = false;

  const emailInput = document.getElementById('jhpEmail');
  const passwordInput = document.getElementById('jhpPassword');
  const passwordToggle = document.getElementById('jhpPasswordToggle');
  const nameInput = document.getElementById('jhpName');
  const autoCleanInput = document.getElementById('jhpAutoClean');
  const debugInput = document.getElementById('jhpDebug');
  const statusEl = document.getElementById('deviceStatus');
  const listEl = document.getElementById('deviceList');

  // ThingNames to skip, and per-device show* entries keyed by ThingName.
  // Entries for devices that are not listed right now (e.g. temporarily removed
  // from the account) are kept, not dropped.
  const ignored = new Set();
  const deviceSettings = new Map();
  // Top-level show* values: what a device shows when it has no entry of its own.
  const showDefaults = {};
  // Devices on the account, from the last successful /devices request.
  let devices = [];

  function setStatus(text) {
    statusEl.textContent = text;
  }

  // Stages the page state into the plugin config (persisted when the user
  // presses Save). Writes are chained so fast typing can't reorder them.
  let pendingWrite = Promise.resolve();
  function sync() {
    pendingWrite = pendingWrite.then(async () => {
      const configs = await homebridge.getPluginConfig();
      if (configs.length === 0) {
        configs.push({ platform: PLATFORM });
      }
      const config = configs[0];
      config.platform = PLATFORM;
      config.name = nameInput.value.trim() || DEFAULT_NAME;
      config.email = emailInput.value.trim();
      config.password = passwordInput.value;
      config.ignoredDevices = Array.from(ignored);
      config.devices = Array.from(deviceSettings.values()).filter((entry) => Object.keys(entry).length > 1);
      if (config.devices.length === 0) {
        delete config.devices;
      }
      config.autoCleanWhenPowerOff = autoCleanInput.checked;
      config.debugMode = debugInput.checked;
      await homebridge.updatePluginConfig(configs);
    }).catch((e) => homebridge.toast.error(String(e), t('configWriteFailed')));
    return pendingWrite;
  }

  function isShown(thingName, key) {
    const value = (deviceSettings.get(thingName) || {})[key];
    return typeof value === 'boolean' ? value : showDefaults[key];
  }

  // Only differences from the default are stored, so config.json stays short.
  function setShown(thingName, key, value) {
    const entry = deviceSettings.get(thingName) || { thingName: thingName };
    if (value === showDefaults[key]) {
      delete entry[key];
    } else {
      entry[key] = value;
    }
    deviceSettings.set(thingName, entry);
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) {
      node.className = className;
    }
    if (text !== undefined) {
      node.textContent = text;
    }
    return node;
  }

  // data-focus names a control across re-renders, so the one just used keeps focus.
  function makeChip(item, pressed, count, focusKey, onClick) {
    const chip = el('button', 'jhp-chip');
    chip.type = 'button';
    chip.setAttribute('aria-pressed', pressed);
    chip.dataset.focus = focusKey;
    chip.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${item.icon}</svg>`;
    chip.append(t(item.label));
    if (count) {
      chip.appendChild(el('span', 'jhp-chip-count', count));
    }
    chip.addEventListener('click', onClick);
    return chip;
  }

  function makeChips(label, chips) {
    const group = el('div', 'jhp-chips');
    group.setAttribute('role', 'group');
    group.setAttribute('aria-label', label);
    for (const chip of chips) {
      group.appendChild(chip);
    }
    return group;
  }

  function renderAllRow(added) {
    const row = el('div', 'jhp-dev jhp-dev-all');
    row.appendChild(el('div', 'jhp-dev-name', t('allDevices')));
    row.appendChild(el('div', 'jhp-dev-meta', t('allDevicesMeta')));
    row.appendChild(makeChips(t('allDevices'), SHOW_ITEMS.map((item) => {
      const shown = added.filter((d) => isShown(d.thingName, item.key)).length;
      const pressed = shown === added.length ? 'true' : shown === 0 ? 'false' : 'mixed';
      return makeChip(item, pressed, `${shown}/${added.length}`, `all:${item.key}`, () => {
        for (const device of added) {
          setShown(device.thingName, item.key, shown !== added.length);
        }
        changed();
      });
    })));
    return row;
  }

  function renderDevice(device) {
    const supported = SUPPORTED_DEVICE_TYPES.includes(device.deviceType);
    const added = supported && !ignored.has(device.thingName);
    const name = device.name || t('unnamed');
    const type = I18N.en['type' + device.deviceType]
      ? t('type' + device.deviceType)
      : t('typeUnknown', { n: device.deviceType });

    const row = el('div', added ? 'jhp-dev' : 'jhp-dev is-off');
    const head = el('div', 'jhp-dev-head');
    const main = el('div', 'jhp-dev-main');
    main.appendChild(el('div', 'jhp-dev-name', name));
    const meta = el('div', 'jhp-dev-meta', `${type}${supported ? '' : ` · ${t('unsupported')}`} · `);
    meta.appendChild(el('span', 'jhp-mono', device.thingName));
    main.appendChild(meta);
    head.appendChild(main);

    if (supported) {
      const sw = el('label', 'jhp-sw');
      sw.title = t('addToHomeKit', { name: name });
      const input = el('input');
      input.type = 'checkbox';
      input.checked = added;
      input.setAttribute('aria-label', t('addToHomeKit', { name: name }));
      input.dataset.focus = `sw:${device.thingName}`;
      input.addEventListener('change', () => {
        if (input.checked) {
          ignored.delete(device.thingName);
        } else {
          ignored.add(device.thingName);
        }
        changed();
      });
      sw.appendChild(input);
      sw.appendChild(el('span', 'jhp-track'));
      head.appendChild(sw);
    }
    row.appendChild(head);

    if (added) {
      row.appendChild(makeChips(t('chipsAria', { name: name }), SHOW_ITEMS.map((item) => {
        const shown = isShown(device.thingName, item.key);
        return makeChip(item, String(shown), '', `chip:${device.thingName}:${item.key}`, () => {
          setShown(device.thingName, item.key, !shown);
          changed();
        });
      })));
    } else if (supported) {
      row.appendChild(el('div', 'jhp-dev-skip', t('notAdded')));
    }
    return row;
  }

  function renderDevices() {
    const focusKey = document.activeElement && document.activeElement.dataset
      ? document.activeElement.dataset.focus
      : undefined;

    listEl.innerHTML = '';
    const added = devices.filter((d) => SUPPORTED_DEVICE_TYPES.includes(d.deviceType) && !ignored.has(d.thingName));
    if (added.length >= 2) {
      listEl.appendChild(renderAllRow(added));
    }
    for (const device of devices) {
      listEl.appendChild(renderDevice(device));
    }
    listEl.hidden = devices.length === 0;

    if (focusKey) {
      const target = Array.from(listEl.querySelectorAll('[data-focus]')).find((node) => node.dataset.focus === focusKey);
      if (target) {
        target.focus();
      }
    }
  }

  function changed() {
    sync();
    renderDevices();
    setStatus(t('unsaved'));
  }

  async function loadDevices() {
    const email = emailInput.value.trim();

    if (!email) {
      setStatus(t('needEmail'));
      return;
    }

    homebridge.showSpinner();
    setStatus(t('loading'));

    try {
      const resp = await homebridge.request('/devices', {
        email: email,
        password: passwordInput.value,
      });

      devices = resp.devices;
      renderDevices();
      setStatus(devices.length === 0
        ? t('noDevices')
        : t('deviceCount', { n: devices.length }) + t(resp.usedCachedToken ? 'tokenCached' : 'tokenFresh'));
    } catch (e) {
      // The server sends a code to translate; its English message is the fallback.
      const code = e && e.error && e.error.code;
      const message = code && I18N.en['err_' + code]
        ? t('err_' + code, { detail: e.error.detail || '' })
        : (e && e.message) || String(e);
      setStatus(t('loadFailed'));
      homebridge.toast.error(message, t('loadFailedTitle'));
    } finally {
      homebridge.hideSpinner();
    }
  }

  // ------------------------------------------------------------------
  // Init
  // ------------------------------------------------------------------

  const configs = await homebridge.getPluginConfig();
  const config = configs.length > 0 ? configs[0] : {};

  emailInput.value = config.email || '';
  passwordInput.value = config.password || '';
  nameInput.value = typeof config.name === 'string' && config.name !== '' ? config.name : DEFAULT_NAME;
  autoCleanInput.checked = config.autoCleanWhenPowerOff === true;
  debugInput.checked = config.debugMode === true;
  for (const item of SHOW_ITEMS) {
    showDefaults[item.key] = config[item.key] !== false;
  }
  for (const thingName of config.ignoredDevices || []) {
    if (typeof thingName === 'string' && thingName !== '') {
      ignored.add(thingName);
    }
  }
  for (const entry of Array.isArray(config.devices) ? config.devices : []) {
    if (entry && typeof entry.thingName === 'string' && entry.thingName !== '') {
      deviceSettings.set(entry.thingName, Object.assign({}, entry));
    }
  }

  for (const input of [emailInput, passwordInput, nameInput]) {
    input.addEventListener('input', sync);
  }
  for (const input of [autoCleanInput, debugInput]) {
    input.addEventListener('change', sync);
  }

  passwordToggle.addEventListener('click', () => {
    const show = passwordInput.type === 'password';
    passwordInput.type = show ? 'text' : 'password';
    passwordToggle.textContent = t(show ? 'hidePassword' : 'showPassword');
    passwordToggle.setAttribute('aria-pressed', String(show));
  });

  const advToggle = document.getElementById('jhpAdvToggle');
  const advBody = document.getElementById('jhpAdvBody');
  advToggle.addEventListener('click', () => {
    const open = advBody.style.display === 'none';
    advBody.style.display = open ? '' : 'none';
    advToggle.setAttribute('aria-expanded', String(open));
    document.getElementById('jhpAdvChevron').innerHTML = open ? '&#9662;' : '&#9656;';
  });

  document.getElementById('btnRefresh').addEventListener('click', () => {
    loadDevices();
  });

  loadDevices();
})();
</script>
